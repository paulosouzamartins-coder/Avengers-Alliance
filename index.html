<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAA PvP Simulator</title>
<style>
:root{--bg:#0d1120;--panel:#161c33;--panel2:#1f2745;--line:#2e3862;--txt:#e9edf9;--mut:#93a0c6;--acc:#f5b82e;--t0:#3b82f6;--t1:#ef4444;
--debuff:#ef4444;--buff:#22c55e;--prop:#3b82f6;--hp:#34d399;--st:#38bdf8;
--c-Blaster:#f97316;--c-Bruiser:#22c55e;--c-Scrapper:#ef4444;--c-Infiltrator:#a855f7;--c-Tactician:#3b82f6;--c-Generalist:#9ca3af;--spd:1}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:14px;align-items:center;padding:8px 16px;background:#090d1a;border-bottom:2px solid var(--acc);flex-wrap:wrap}
header h1{margin:0;font-size:19px}header h1 span{color:var(--acc)}
button,select,input{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.4;cursor:not-allowed}
button.on,button.primary{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
main{max-width:1500px;margin:auto;padding:12px 16px 40px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.hint{color:var(--mut);font-size:12px}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;margin:1px 2px 1px 0;border:1px solid;white-space:nowrap}
.chip.debuff{color:#fecaca;background:#4a1515;border-color:var(--debuff)}
.chip.buff{color:#bbf7d0;background:#0f3b22;border-color:var(--buff)}
.chip.prop{color:#bfdbfe;background:#12306a;border-color:var(--prop)}
.chip.type{color:var(--mut);background:var(--panel2);border-color:var(--line)}
/* arte com fallback */
.art{position:relative;background:linear-gradient(160deg,var(--c,#555),#111);overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;text-shadow:0 2px 4px #000}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art span{position:relative;opacity:.9;text-align:center;padding:4px;font-size:12px}
/* ===== seleção: layout champ select (equipe A | centro | equipe B) ===== */
.cs-root{--g1:#f0e6d2;--g2:#c8aa6e;--g3:#785a28;--tl:#0ac8b9;--d0:#010a13;--d1:#071c26;--d2:#0c2f3c;position:relative;height:calc(100vh - 112px);min-height:680px;border-radius:18px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 0%,#0f4552 0%,transparent 60%),radial-gradient(ellipse at 0% 100%,#0a2f4a 0%,transparent 55%),radial-gradient(ellipse at 100% 100%,#3a1630 0%,transparent 55%),linear-gradient(180deg,var(--d1),var(--d0));
 border:2px solid var(--g3);box-shadow:inset 0 0 60px #000a,0 0 0 1px #000}
.cs-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cs-bg::before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg at 50% 40%,transparent 0 20%,#0ac8b91a 28%,transparent 36% 60%,#c8aa6e14 70%,transparent 80%);animation:spin 40s linear infinite}
.cs-bg i{position:absolute;bottom:-12px;width:4px;height:4px;border-radius:50%;background:var(--g2);box-shadow:0 0 8px 2px #c8aa6e88;opacity:0;animation:rise linear infinite}
.cs-bg i:nth-child(3n){background:var(--tl);box-shadow:0 0 8px 2px #0ac8b988}
.cs-main{position:relative;display:grid;grid-template-columns:clamp(190px,17vw,260px) minmax(0,1fr) clamp(190px,17vw,260px);gap:16px;height:100%;padding:12px 16px 14px}
.cs-side{display:flex;flex-direction:column;gap:10px;padding-top:56px;min-height:0}
.cs-side h3{margin:0;text-align:center;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--g2);position:relative}
.cs-side h3::after{content:"";display:block;height:2px;margin:6px 8% 0;background:linear-gradient(90deg,transparent,var(--g2),transparent)}
#tA h3{color:#7fd8ff}#tB h3{color:#ff9a8a}
.slots{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.slot{flex:1;min-height:0;position:relative;overflow:hidden;cursor:pointer;display:grid;place-items:center;color:#5d7c86;font-size:12px;letter-spacing:.15em;text-transform:uppercase;
 background:linear-gradient(135deg,#0b2430,#06131b);border:2px solid var(--g3);border-radius:14px 70px 14px 70px;box-shadow:inset 0 0 22px #000c;transition:transform .2s,border-color .2s}
#tB .slot{border-radius:70px 14px 70px 14px}
.slot:hover{transform:scale(1.02);border-color:var(--g2)}
.slot .art{position:absolute;inset:0}.slot .art img{object-position:center top}
#tB .slot .art img{transform:scaleX(-1)}
.slot b{position:absolute;bottom:0;left:0;right:0;padding:14px 10px 5px;text-align:center;font-size:13px;letter-spacing:.08em;color:var(--g1);background:linear-gradient(0deg,#000d,transparent)}
.slot.next{border-color:var(--g1);animation:slotpulse 1.6s ease-in-out infinite}
.slot.next::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#f0e6d233 50%,transparent 65%);background-size:250% 100%;animation:sweep 2.4s linear infinite}
.cs-center{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.cs-title{position:relative;align-self:center;min-width:min(520px,80%);text-align:center;padding:6px 40px 12px;font-size:26px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--g1);
 background:linear-gradient(180deg,#0e3340,#06141c);border:2px solid var(--g2);border-top:0;border-radius:0 0 90px 90px/0 0 46px 46px;overflow:hidden;text-shadow:0 0 14px #0ac8b9aa}
.cs-title::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#f0e6d240 50%,transparent 60%);background-size:260% 100%;animation:sweep 5s linear infinite}
.cs-title small{display:block;font-size:11px;letter-spacing:.2em;color:var(--g2);font-weight:600}
.stage{position:relative;flex:1 1 auto;min-height:260px;border:2px solid var(--g2);border-radius:30px 30px 90px 90px/30px 30px 56px 56px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 85%,#0ac8b955,transparent 62%),linear-gradient(180deg,#0a2530,#050f15);box-shadow:inset 0 0 50px #000d,0 0 26px #0ac8b922}
.stage::before{content:"";position:absolute;inset:6px;border:1px solid #c8aa6e66;border-radius:24px 24px 84px 84px/24px 24px 50px 50px;pointer-events:none;z-index:2}
.stage .art{position:absolute;inset:14px 14px 10px;background:transparent;animation:floaty 6s ease-in-out infinite}
.stage .art img{object-fit:contain;object-position:center}
.stage.flip .art img{transform:scaleX(-1)}
.stage .art span{font-size:42px;opacity:.35;letter-spacing:.1em}
.stage .vazio{position:absolute;inset:0;display:grid;place-items:center;color:#5d7c86;letter-spacing:.2em;text-transform:uppercase}
.cs-info{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;min-height:84px;padding:6px 12px;background:linear-gradient(180deg,#0b2531,#06131b);border:2px solid var(--g3);border-radius:14px 14px 40px 40px}
.cs-info .who{text-align:center;min-width:150px}.cs-info h2{margin:0;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--g1)}
.cs-info .sks{display:flex;gap:10px}
.cs-info .sk1{width:84px;text-align:center;font-size:10px;line-height:1.15;color:var(--g1)}
.cs-info .sk1 .art{width:46px;height:46px;margin:0 auto 3px;border-radius:50%;border:2px solid var(--g2);box-shadow:0 0 10px #0ac8b944;font-size:8px}
.cs-gridwrap{height:clamp(130px,19vh,190px);flex:none;overflow-y:auto;padding:10px;background:linear-gradient(180deg,#07202b,#040e14);border:2px solid var(--g3);border-radius:14px;box-shadow:inset 0 0 24px #000c}
.cs-gridwrap::-webkit-scrollbar{width:8px}.cs-gridwrap::-webkit-scrollbar-thumb{background:var(--g3);border-radius:4px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}
.face{aspect-ratio:1;position:relative;overflow:hidden;padding:0;cursor:pointer;background:#08141b;border:2px solid var(--g3);border-radius:12px;transition:transform .15s,border-color .15s,box-shadow .15s}
.face .art{position:absolute;inset:0;font-size:10px}
.face:hover:not(.locked){transform:translateY(-3px);border-color:var(--g1);box-shadow:0 6px 14px #000a,0 0 12px #c8aa6e66}
.face.sel{border-color:var(--g1);animation:selglow 1.4s ease-in-out infinite}
.face.locked{opacity:.4;filter:grayscale(1);cursor:not-allowed}.face.locked::after{content:"🔒";position:absolute;right:3px;bottom:1px;font-size:12px}
.cs-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cs-actions button{background:linear-gradient(180deg,#12394a,#08202b);border:2px solid var(--g3);color:var(--g1);border-radius:20px;padding:7px 20px;letter-spacing:.1em;text-transform:uppercase;font-size:12px;font-weight:700}
.cs-actions button:hover:not(:disabled){border-color:var(--g1);box-shadow:0 0 14px #c8aa6e66}
.cs-actions button.primary{background:linear-gradient(180deg,#d6b878,#8a6a2c);color:#1a1205;border-color:var(--g1)}
.cls{display:inline-block;padding:0 8px;border-radius:10px;font-size:11px;font-weight:700;background:var(--c);color:#111}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-110vh) scale(1.2);opacity:0}}
@keyframes sweep{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes slotpulse{50%{box-shadow:0 0 18px 2px #f0e6d2aa,inset 0 0 22px #000c}}
@keyframes selglow{50%{box-shadow:0 0 0 2px var(--g1),0 0 18px #f0e6d2}}
@keyframes floaty{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.cs-root *,.cs-root *::before,.cs-root *::after{animation:none!important}}
/* batalha */
.order{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:8px;overflow:auto}
.order .o{width:46px;height:46px;border-radius:50%;overflow:hidden;border:3px solid var(--line);flex:none;position:relative}.order .o.t0{border-color:var(--t0)}.order .o.t1{border-color:var(--t1)}
.order .o.cur{box-shadow:0 0 0 3px var(--acc),0 0 14px var(--acc);transform:scale(1.15)}.order .o.done{opacity:.35}.order .o.dead{display:none}.order .o .art{position:absolute;inset:0;font-size:10px}
.order .lbl{color:var(--mut);font-size:12px;margin-right:6px;white-space:nowrap}
.arena{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;border-radius:12px;border:1px solid var(--line);min-height:380px;overflow:hidden;
 background:linear-gradient(180deg,#27315a 0%,#1a2140 58%,#10152b 58%,#0b0f20 100%)}
.side{display:flex;gap:12px;justify-content:space-around;align-items:flex-end}
.unit{position:relative;width:170px;background:#0b1024cc;border:3px solid transparent;border-radius:10px;overflow:hidden;transition:transform .2s}
.unit.t0{border-bottom-color:var(--t0)}.unit.t1{border-bottom-color:var(--t1)}
.unit .art{height:170px}.unit .art img{object-fit:contain}.unit.t1 .art img{transform:scaleX(-1)}.unit .meta{padding:5px 7px}.unit .nm{font-weight:700;font-size:13px}
.bar{height:9px;background:#000a;border-radius:5px;overflow:hidden;margin:3px 0}.bar i{display:block;height:100%;transition:width .35s}
.bar.hp i{background:var(--hp)}.bar.hp i.low{background:#f59e0b}.bar.hp i.crit{background:#ef4444}.bar.st i{background:var(--st)}
.bt{font-size:10px;color:var(--mut);display:flex;justify-content:space-between}.fx{min-height:20px}
.unit.cur{border-color:var(--acc);box-shadow:0 0 18px #f5b82e88}.unit.pick{outline:3px dashed var(--hp);cursor:pointer;animation:pulse 1s infinite}.unit.dead{opacity:.25;filter:grayscale(1)}
.unit.shake{animation:shake .35s}.unit.lunge0{animation:lunge0 .5s}.unit.lunge1{animation:lunge1 .5s}
.float{position:absolute;font-weight:900;font-size:26px;text-shadow:0 2px 4px #000;pointer-events:none;animation:up 1.1s ease-out forwards;transform:translate(-50%,-50%);z-index:5}
.float.crit{font-size:36px;color:#ffd54a}.float.miss{font-size:16px;color:#cbd5e1}.float.heal{color:var(--hp)}.float.dot{color:#fb923c;font-size:20px}.float.txt{font-size:14px;color:#fff}.float.abs{color:var(--st);font-size:20px}
@keyframes up{to{opacity:0;margin-top:-60px}}@keyframes pulse{50%{background:#143b2d}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes lunge0{40%{transform:translateX(90px)}}@keyframes lunge1{40%{transform:translateX(-90px)}}
.winner{position:absolute;inset:0;background:#000c;display:grid;place-items:center;font-size:38px;font-weight:900;color:var(--acc);text-align:center;z-index:9}
.bottom{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;margin-top:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}.panel h3{margin:0 0 6px;font-size:13px;color:var(--acc)}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:6px;height:auto}
.sk .art{width:56px;height:56px;border-radius:10px;font-size:9px}.sk b{font-size:12px}.sk .cost{font-size:11px;color:var(--st)}
.sk.sel{border-color:var(--acc);background:#3a2e0d}.sk .why{font-size:10px;color:#fca5a5}
#detail,#log{max-height:260px;overflow:auto;font-size:12px}#log div{padding:1px 0;border-bottom:1px solid #ffffff10}
#log .dm{color:#fca5a5}#log .sy{color:var(--acc)}#log .ef{color:#c4b5fd}#log .df{font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}.kv>*:nth-child(odd){color:var(--mut)}
/* dados */
.tabs button{margin-right:4px}.tw{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
table{border-collapse:collapse;font-size:12px;width:max-content}th,td{border:1px solid var(--line);padding:4px 8px;vertical-align:top}th{position:sticky;top:0;background:var(--panel2)}td.n{text-align:right}td.pv{background:#4a3205}
@media(max-width:1000px){.bottom,.arena{grid-template-columns:1fr}.cs-root{height:auto}.cs-main{grid-template-columns:1fr}.cs-side{padding-top:0}.slots{flex-direction:row}.slot{min-height:110px}.stage{min-height:340px}.skills{grid-template-columns:repeat(2,1fr)}.unit{width:30%;min-width:110px}}
</style>
</head>
<body>
<header>
  <h1>MAA <span>PvP Simulator</span></h1>
  <nav><button data-v="sel" class="on">Seleção</button> <button data-v="bat">Batalha</button> <button data-v="dat">Dados</button></nav>
  <span class="hint" id="ver"></span>
</header>
<main>
  <section id="v-sel" class="cs-root">
    <div class="cs-bg"><i style="left:5%;animation-duration:9s;animation-delay:-0s"></i><i style="left:42%;animation-duration:14s;animation-delay:-3s"></i><i style="left:79%;animation-duration:10s;animation-delay:-6s"></i><i style="left:16%;animation-duration:15s;animation-delay:-9s"></i><i style="left:53%;animation-duration:11s;animation-delay:-1s"></i><i style="left:90%;animation-duration:16s;animation-delay:-4s"></i><i style="left:27%;animation-duration:12s;animation-delay:-7s"></i><i style="left:64%;animation-duration:17s;animation-delay:-10s"></i><i style="left:1%;animation-duration:13s;animation-delay:-2s"></i><i style="left:38%;animation-duration:9s;animation-delay:-5s"></i><i style="left:75%;animation-duration:14s;animation-delay:-8s"></i><i style="left:12%;animation-duration:10s;animation-delay:-0s"></i><i style="left:49%;animation-duration:15s;animation-delay:-3s"></i><i style="left:86%;animation-duration:11s;animation-delay:-6s"></i><i style="left:23%;animation-duration:16s;animation-delay:-9s"></i><i style="left:60%;animation-duration:12s;animation-delay:-1s"></i><i style="left:97%;animation-duration:17s;animation-delay:-4s"></i><i style="left:34%;animation-duration:13s;animation-delay:-7s"></i><i style="left:71%;animation-duration:9s;animation-delay:-10s"></i><i style="left:8%;animation-duration:14s;animation-delay:-2s"></i><i style="left:45%;animation-duration:10s;animation-delay:-5s"></i><i style="left:82%;animation-duration:15s;animation-delay:-8s"></i></div>
    <div class="cs-main">
      <aside class="cs-side team" id="tA"><h3>Equipe A</h3><div class="slots"></div></aside>
      <div class="cs-center">
        <div class="cs-title" id="csTitle">Sua escolha<small id="csSub"></small></div>
        <div class="stage" id="csPick"></div>
        <div class="cs-info" id="csInfo"></div>
        <div class="cs-gridwrap"><div class="roster" id="roster"></div></div>
        <div class="cs-actions"><button id="bConfirm" class="primary" disabled>Confirmar herói</button><button id="bRand">Aleatório</button><button id="bClear">Limpar</button><button id="bStart" class="primary" disabled>Iniciar batalha</button></div>
      </div>
      <aside class="cs-side team" id="tB"><h3>Equipe B</h3><div class="slots"></div></aside>
    </div>
  </section>

  <section id="v-bat" hidden>
    <div class="order" id="order"></div>
    <div class="arena" id="arena"><div class="side" id="sideA"></div><div class="side" id="sideB"></div><div class="winner" id="winner" hidden></div></div>
    <div class="bottom">
      <div class="panel"><h3 id="turnTitle">Golpes</h3><div class="skills" id="skills"></div>
        <div class="row"><button id="bPass">Passar turno</button><label class="hint"><input type="checkbox" id="fast"> animações rápidas</label><button id="bBack">Voltar à seleção</button></div></div>
      <div class="panel"><h3>Detalhes</h3><div id="detail"><span class="hint">Passe o mouse sobre um golpe ou clique num herói.</span></div></div>
      <div class="panel"><h3>Histórico</h3><div id="log"></div></div>
    </div>
  </section>

  <section id="v-dat" hidden>
    <div class="row tabs" id="datTabs"></div>
    <div class="hint" id="datHint"></div>
    <div class="tw"><table id="datTable"></table></div>
    <button id="datCsv">Baixar esta tabela (CSV para Excel)</button>
  </section>
</main>

<script id="data">
/* GERADO por tools/importar.py a partir de dados/maa.xlsx — para mudar números, edite a planilha e rode o importador.
   Fórmulas (engine): dano por hit = (Total damage / Hits) × (Ataque ÷ Defesa do alvo); chance de acerto = Hit Chance × (Precisão ÷ Evasão do alvo), máx. 100%;
   crítico = dano × config.danoCritico (PROVISÓRIO); ordem de turno = Evasão. Status (debuff/buff/propriedade) só são nomes, sem efeito, até as bibliotecas existirem. */
const DATA = {
  versao: '0.3.0',
  config: {"modos": {"pve": "1 jogador x máquina (3 heróis do jogador)", "pvp": "1 jogador x 1 jogador (3 heróis cada)", "pvp6": "3 jogadores x 3 jogadores (1 herói por jogador)"}, "staminaInicial": 100, "staminaRecupera": 20, "danoCritico": 1.5},
  classes: {"Blaster": {"vantagens": [], "desvantagens": []}, "Bruiser": {"vantagens": [], "desvantagens": []}, "Scrapper": {"vantagens": [], "desvantagens": []}, "Infiltrator": {"vantagens": [], "desvantagens": []}, "Tactician": {"vantagens": [], "desvantagens": []}, "Generalist": {"vantagens": [], "desvantagens": []}},
  herois: [

<script id="engine">
/* ============================================================================
   ENGINE — independente da interface. Recebe DATA e devolve eventos. Sem números de conteúdo.
   Dano por hit   = (Total damage ÷ Hits) × (Ataque do atacante ÷ Defesa do alvo)      [ataque = defesa → dano puro; 50% maior → ×1,5]
   Chance de acerto = Hit Chance do golpe × (Precisão do atacante ÷ Evasão do alvo), limitada a 100%
   Crítico = chance do golpe; dano × config.danoCritico (provisório). Ordem de turno por rodada = Evasão (empate sorteado).
   Stamina: +config.staminaRecupera no início do turno do herói. Status = só nomes (sem efeito) até haver as bibliotecas.
   ============================================================================ */
function createBattle(D, teams, opts) {
  opts = opts || {};
  const rng = opts.rng || Math.random, C = D.config;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ratio = (a, b) => (b > 0 ? a / b : 1);
  const r1 = (v) => Math.round(v * 10) / 10;
  const SK = {}; D.golpes.forEach((s) => { SK[s.id] = s; });
  const units = [], events = [];
  const B = { units, events, round: 0, order: [], idx: -1, current: null, phase: 'idle', winner: null, turnStamp: 0, SK };
  const ev = (o) => { o.seq = events.length; events.push(o); return o; };

  const count = {}; teams.flat().forEach((id) => { count[id] = (count[id] || 0) + 1; });
  const seen = {};
  teams.forEach((team, ti) => team.forEach((hid, slot) => {
    const h = D.herois.find((x) => x.id === hid);
    if (!h) throw new Error('Herói inexistente: ' + hid);
    seen[hid] = (seen[hid] || 0) + 1;
    units.push({ uid: 'u' + units.length, team: ti, slot, heroId: h.id, hero: h, name: h.nome + (count[hid] > 1 ? ' ' + seen[hid] : ''), cls: h.classe,
      maxHp: h.hp, hp: h.hp, stats: { atk: h.atk, def: h.def, acc: h.acc, eva: h.eva }, stamina: C.staminaInicial, cd: {}, cdStamp: {}, status: [], alive: true, skills: h.golpes.slice() });
  }));

  const alive = (t) => units.filter((u) => u.alive && (t == null || u.team === t));
  const stat = (u, k) => u.stats[k];
  const hitChance = (att, tgt, sk) => (sk.hit == null ? 100 : r1(clamp(sk.hit * ratio(att.stats.acc, tgt.stats.eva), 0, 100)));
  const critChance = (sk) => clamp(sk.crit || 0, 0, 100);
  const perHit = (att, tgt, sk) => (sk.golpes > 0 ? (sk.dano / sk.golpes) * ratio(att.stats.atk, tgt.stats.def) : 0);
  B.stat = stat; B.hitChance = hitChance; B.critChance = critChance; B.perHit = perHit;

  function applyStatus(u, st, src) {
    if (!u.alive) return;
    let s = u.status.find((x) => x.nome === st.nome);
    if (s) s.stacks += st.x; else { s = { nome: st.nome, stacks: st.x }; u.status.push(s); }
    ev({ t: 'fx', uid: u.uid, nome: st.nome, stacks: s.stacks, src: src ? src.uid : null });
  }
  function checkWin() {
    const a = alive(0).length, b = alive(1).length;
    if (a && b) return;
    B.phase = 'ended'; B.winner = !a && !b ? -1 : !a ? 1 : 0; B.current = null; ev({ t: 'win', winner: B.winner });
  }
  function resolveHit(att, tgt, sk) {
    const chance = hitChance(att, tgt, sk);
    if (!(rng() * 100 < chance)) { ev({ t: 'miss', src: att.uid, tgt: tgt.uid, chance }); return false; }
    const crit = rng() * 100 < critChance(sk);
    const amount = Math.max(0, r1(perHit(att, tgt, sk) * (crit ? C.danoCritico : 1)));
    tgt.hp = r1(Math.max(0, tgt.hp - amount));
    ev({ t: 'dmg', src: att.uid, tgt: tgt.uid, amount, crit, skill: sk.id, hpAfter: tgt.hp });
    if (tgt.hp <= 0 && tgt.alive) { tgt.alive = false; ev({ t: 'defeat', uid: tgt.uid }); checkWin(); }
    return true;
  }
  function executeSkill(u, sk, targets) {
    ev({ t: 'skill', src: u.uid, skill: sk.id, nome: sk.nome, targets: targets.map((x) => x.uid) });
    const hostile = sk.alvo === 'enemy1' || sk.alvo === 'enemyAll', landed = {};
    if (hostile && sk.golpes > 0) targets.forEach((tg) => { for (let i = 0; i < sk.golpes; i++) { if (!tg.alive) break; if (resolveHit(u, tg, sk)) landed[tg.uid] = (landed[tg.uid] || 0) + 1; } });
    const ap = sk.aplica || {}, ok = (tg) => tg.alive && (!hostile || sk.golpes === 0 || landed[tg.uid]);
    /* cada grupo de efeitos vale por si, independente do alvo do golpe (ex.: atacar todos os inimigos e buffar todos os aliados).
       Em golpes que causam dano, status em inimigos só entra em quem foi acertado. */
    const into = (list, tgts) => (list || []).length && tgts.forEach((tg) => list.forEach((st) => applyStatus(tg, st, u)));
    if (sk.alvo === 'enemy1' || sk.alvo === 'ally1') into(ap[sk.alvo], targets.filter(ok));
    into(ap.enemyAll, (sk.alvo === 'enemyAll' ? targets : alive(1 - u.team)).filter(ok));
    into(ap.allyAll, alive(u.team));
    into(ap.self, [u]);
  }
  function validTargets(u, sk) {
    if (sk.alvo === 'enemy1') return alive(1 - u.team).map((x) => x.uid);
    if (sk.alvo === 'ally1') return alive(u.team).map((x) => x.uid);
    return [];
  }
  function resolveTargets(u, sk, pick) {
    const find = (id) => units.find((x) => x.uid === id);
    switch (sk.alvo) {
      case 'self': return [u];
      case 'allyAll': return alive(u.team);
      case 'enemyAll': return alive(1 - u.team);
      case 'ally1': case 'enemy1': return [find(pick)];
    }
    return [];
  }
  B.options = function () {
    const u = B.current; if (!u) return [];
    return u.skills.map((id) => {
      const sk = SK[id]; let reason = null;
      if (u.stamina < sk.custo) reason = 'Stamina insuficiente (precisa de ' + sk.custo + '%)';
      else if ((u.cd[id] || 0) > 0) reason = 'Em recarga: ' + u.cd[id] + ' rodada(s)';
      const valid = validTargets(u, sk);
      if (!reason && (sk.alvo === 'enemy1' || sk.alvo === 'ally1') && !valid.length) reason = 'Sem alvos válidos';
      return { skill: sk, ok: !reason, reason, needsPick: sk.alvo === 'enemy1' || sk.alvo === 'ally1', valid };
    });
  };
  function endTurn(u) {
    Object.keys(u.cd).forEach((k) => { if (u.cd[k] > 0 && u.cdStamp[k] !== B.turnStamp) u.cd[k]--; });
    B.phase = 'idle'; B.current = null;
  }
  B.act = function (skillId, targetUid) {
    if (B.phase !== 'action') throw new Error('Não é possível agir agora (fora do momento correto).');
    const u = B.current, opt = B.options().find((o) => o.skill.id === skillId);
    if (!opt) throw new Error('Esse golpe não pertence ao herói ativo.');
    if (!opt.ok) throw new Error(opt.reason);
    if (opt.needsPick && !opt.valid.includes(targetUid)) throw new Error('Alvo inválido.');
    const start = events.length, sk = opt.skill;
    u.stamina -= sk.custo; ev({ t: 'stamina', uid: u.uid, value: u.stamina });
    if (sk.recarga > 0) { u.cd[sk.id] = sk.recarga; u.cdStamp[sk.id] = B.turnStamp; }
    executeSkill(u, sk, resolveTargets(u, sk, targetUid));
    if (B.phase === 'ended') return events.slice(start);
    endTurn(u); B.next(); return events.slice(start);
  };
  B.pass = function () {
    if (B.phase !== 'action') throw new Error('Não é possível agir agora.');
    const start = events.length; ev({ t: 'pass', uid: B.current.uid }); endTurn(B.current); B.next(); return events.slice(start);
  };
  function newRound() {
    B.round++;
    B.order = alive().map((u) => ({ u, k: stat(u, 'eva') + rng() * 0.5 })).sort((a, b) => b.k - a.k).map((x) => x.u);
    B.idx = -1; ev({ t: 'round', n: B.round, order: B.order.map((u) => u.uid) });
  }
  B.next = function () {
    if (B.phase === 'ended') return;
    if (B.phase === 'action') throw new Error('O herói ativo ainda precisa agir.');
    for (let guard = 0; guard < 100; guard++) {
      if (B.idx + 1 >= B.order.length) newRound();
      const u = B.order[++B.idx]; if (!u.alive) continue;
      B.turnStamp++; B.current = u;
      u.stamina = Math.min(100, u.stamina + C.staminaRecupera); ev({ t: 'turn', uid: u.uid, round: B.round, stamina: u.stamina });
      B.phase = 'action'; return;
    }
  };
  B.runAuto = function (maxActions) {
    let n = 0;
    while (B.phase === 'action' && n++ < (maxActions || 3000)) {
      const ok = B.options().filter((o) => o.ok);
      if (!ok.length) { B.pass(); continue; }
      const o = ok[Math.floor(rng() * ok.length)];
      B.act(o.skill.id, o.needsPick ? o.valid[Math.floor(rng() * o.valid.length)] : null);
    }
    return B.winner;
  };
  B.next();
  return B;
}
</script>

<script id="ui">
(function () {

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    d.innerHTML = '<span>' + esc(label.text) + '</span>';
    if (src) { /* tenta webp, png, jpg, jpeg (e, se o nome tiver apóstrofo, também sem ele); a extensão escrita no dado é ignorada */
      const base = src.replace(/\.\w+$/, ''), bases = base.includes("'") ? [base, base.replace(/'/g, '')] : [base], cand = [];
      bases.forEach((b) => ['webp', 'png', 'jpg', 'jpeg'].forEach((x) => cand.push(b + '.' + x))); let k = 0;
      const i = new Image(); i.alt = ''; i.onerror = () => { if (++k < cand.length) i.src = cand[k]; else i.remove(); }; i.src = cand[0]; d.appendChild(i); }
    return d;
  }
  const chip = (txt, kind, title) => '<span class="chip ' + kind + '" title="' + esc(title || '') + '">' + esc(txt) + '</span>';

  /* ---------- navegação ---------- */

  $$('header nav button').forEach((b) => (b.onclick = () => view(b.dataset.v)));

  /* ---------- seleção ---------- */
  /* teams[t][i] = { heroi, dono }.  dono = quem controla o herói (null = jogador local, hoje).
     Preparado para os modos futuros (DATA.config.modos): 1 jogador x máquina, jogador x jogador (3v3) e 3 jogadores x 3 jogadores
     (um herói por jogador). Nada de rede/IA nesta etapa; a batalha ainda é local ("hotseat"). */
  const teams = [[], []];

  const ids = (t) => teams[t].map((p) => p.heroi);
  let preview = null;
  function renderSel() {
    const at = activeTeam();
    [['#tA', 0], ['#tB', 1]].forEach(([sel, t]) => {
      const box = $(sel + ' .slots'); box.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const p = teams[t][i], h = p && H(p.heroi), d = el('div', 'slot' + (!h && at === t && i === teams[t].length ? ' next' : ''), h ? '' : 'vazio');
        /* herói confirmado: assets/smallportrait/<id> (lado B espelhado por CSS) */
        if (h) { d.appendChild(art(h.smallportrait, { text: h.nome, cls: h.classe })); d.appendChild(el('b', '', esc(h.nome))); d.onclick = () => { teams[t].splice(i, 1); renderSel(); }; }

    /* palco: portrait grande, redimensionado para caber inteiro e centralizado; espelhado quando a vez é da equipe B */
    const pk = $('#csPick'), inf = $('#csInfo'), h = preview && H(preview);
    pk.innerHTML = ''; inf.innerHTML = ''; pk.classList.toggle('flip', at === 1);
    if (h) {

      const who = el('div', 'who', '<h2>' + esc(h.nome) + '</h2><span class="cls" style="--c:var(--c-' + h.classe + ')">' + h.classe + '</span><div class="hint">HP ' + h.hp + ' · ATK ' + h.atk + ' · DEF ' + h.def + ' · PRE ' + h.acc + ' · EVA ' + h.eva + '</div>');
      inf.appendChild(who);
      const sks = el('div', 'sks');
      h.golpes.forEach((g) => { const sk = SKM[g]; if (!sk) return; const b = el('div', 'sk1'); b.title = sk.nome; b.appendChild(art(sk.icone, { text: sk.nome.split(' ').map((w) => w[0]).join(''), cls: h.classe })); b.appendChild(el('div', '', esc(sk.nome))); sks.appendChild(b); });
      inf.appendChild(sks);
    } else { pk.appendChild(el('div', 'vazio', 'Selecione um herói')); }
    $('#bConfirm').disabled = !(h && at >= 0);
  }
  $('#bConfirm').onclick = () => { const t = activeTeam(); if (t < 0 || !preview) return; teams[t].push({ heroi: preview, dono: null }); renderSel(); };
  const free = () => D.herois.filter((h) => !h.bloqueado).map((h) => h.id);
  const pick1 = () => { const f = free(); return { heroi: f[Math.floor(Math.random() * f.length)], dono: null }; };
  $('#bRand').onclick = () => { teams[0] = []; teams[1] = []; for (let i = 0; i < 3; i++) { teams[0].push(pick1()); teams[1].push(pick1()); } renderSel(); };
  $('#bClear').onclick = () => { teams[0] = []; teams[1] = []; renderSel(); };

  /* ---------- batalha ---------- */
  let B = null, busy = false, picking = null;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms * ($('#fast').checked ? 0.3 : 1)));
  const U = (uid) => B.units.find((u) => u.uid === uid);
  const node = (uid) => $('#arena [data-uid="' + uid + '"]');
  const shown = {};

  $('#bStart').onclick = () => {
    B = createBattle(D, [ids(0), ids(1)]); window.__battle = B;
    B.units.forEach((u) => { shown[u.uid] = { hp: u.hp, st: u.stamina }; });
    $('#winner').hidden = true; $('#log').innerHTML = ''; picking = null;
    buildArena(); logEvents(B.events); refresh(); view('bat');
  };
  $('#bBack').onclick = () => view('sel');
  $('#bPass').onclick = async () => { if (busy || !B || B.phase !== 'action') return; await run(() => B.pass()); };

  function buildArena() {
    ['A', 'B'].forEach((s, t) => {
      const side = $('#side' + s); side.innerHTML = '';
      B.units.filter((u) => u.team === t).forEach((u) => {
        const d = el('div', 'unit t' + t); d.dataset.uid = u.uid;
        d.appendChild(art(u.hero.portrait, { text: u.name, cls: u.cls }));
        d.appendChild(el('div', 'meta', '<div class="nm">' + esc(u.name) + '</div><div class="bar hp"><i></i></div><div class="bt"><span class="h"></span><span>HP</span></div><div class="bar st"><i></i></div><div class="bt"><span class="s"></span><span>Stamina</span></div><div class="fx"></div>'));
        d.onclick = () => onUnit(u.uid); side.appendChild(d);
      });
    });
  }
  function refresh() {
    B.units.forEach((u) => {
      const d = node(u.uid), v = shown[u.uid], p = v.hp / u.maxHp * 100;
      const bar = $('.hp i', d); bar.style.width = p + '%'; bar.className = p < 25 ? 'crit' : p < 50 ? 'low' : '';
      $('.h', d).textContent = Math.round(v.hp * 10) / 10 + ' / ' + u.maxHp; $('.st i', d).style.width = v.st + '%'; $('.s', d).textContent = Math.round(v.st) + '%';
      $('.fx', d).innerHTML = u.status.map((s) => chip(s.nome + (s.stacks > 1 ? ' ×' + s.stacks : ''), 'type', 'Status sem efeito por enquanto (biblioteca futura)')).join('');
      d.classList.toggle('cur', B.current === u); d.classList.toggle('dead', !u.alive);
    });
    const o = $('#order'); o.innerHTML = '<span class="lbl">Rodada ' + B.round + ' — ordem por Evasão:</span>';
    B.order.forEach((u, i) => { const n = el('div', 'o t' + u.team + (B.current === u ? ' cur' : i < B.idx || (i === B.idx && B.current !== u) ? ' done' : '') + (u.alive ? '' : ' dead')); n.title = u.name + ' (evasão ' + B.stat(u, 'eva') + ')'; n.appendChild(art(u.hero.smallportrait, { text: u.name.split(' ')[0], cls: u.cls })); o.appendChild(n); });

  const ALVO = { enemy1: '1 inimigo', enemyAll: 'todos os inimigos', ally1: '1 aliado', allyAll: 'todos os aliados', self: 'si próprio' };
  const stTxt = (l) => l.map((x) => chip(x.nome + (x.x > 1 ? ' ×' + x.x : ''), 'type')).join('');
  function skillDetail(s) {
    const ap = s.aplica || {}, G = { enemy1: '1 inimigo', enemyAll: 'Todos os inimigos', ally1: '1 aliado', allyAll: 'Todos os aliados', self: 'Si próprio' };
    $('#detail').innerHTML = '<b>' + esc(s.nome) + '</b><div class="kv"><span>Stamina</span><span>' + s.custo + '%</span><span>Alvo</span><span>' + ALVO[s.alvo] + '</span><span>Dano total</span><span>' + s.dano + '</span><span>Nº de hits</span><span>' + s.golpes + '</span><span>Hit / Crit</span><span>' + (s.hit == null ? '—' : s.hit + '% / ' + s.crit + '%') + '</span><span>Recarga</span><span>' + (s.recarga || '—') + '</span><span>Tipos</span><span>' + s.tipos.map((t) => chip(t, 'type')).join('') + '</span><span>Propriedades</span><span>' + (s.props.map((p) => chip(p, 'prop', 'Sem efeito por enquanto')).join('') || '—') + '</span></div>' +
      Object.keys(ap).map((g) => '<div>' + G[g] + ': ' + stTxt(ap[g]) + '</div>').join('');
  }
  function onUnit(uid) {
    if (picking && picking.valid.includes(uid)) { const o = picking; picking = null; run(() => B.act(o.skill.id, uid)); return; }
    const u = U(uid), st = (k) => B.stat(u, k);
    $('#detail').innerHTML = '<b>' + esc(u.name) + '</b> <span class="cls" style="--c:var(--c-' + u.cls + ')">' + u.cls + '</span><div class="kv"><span>HP</span><span>' + u.hp + ' / ' + u.maxHp + '</span><span>Ataque</span><span>' + st('atk') + '</span><span>Defesa</span><span>' + st('def') + '</span><span>Precisão</span><span>' + st('acc') + '</span><span>Evasão</span><span>' + st('eva') + '</span><span>Afiliações</span><span>' + (esc(u.hero.afiliacoes.join(', ')) || 'pendente') + '</span><span>Status</span><span>' + (u.status.map((x) => chip(x.nome + (x.stacks > 1 ? ' ×' + x.stacks : ''), 'type')).join('') || '—') + '</span></div>';
  }
  function choose(o) {
    if (busy) return;
    if (!o.needsPick) return run(() => B.act(o.skill.id, null));
    picking = o; $$('#skills .sk').forEach((b) => b.classList.remove('sel')); skillDetail(o.skill);
    $$('.unit').forEach((d) => d.classList.toggle('pick', o.valid.includes(d.dataset.uid)));
  }

  function floater(uid, text, cls) { const d = node(uid); if (!d) return; const a = $('#arena').getBoundingClientRect(), r = d.getBoundingClientRect(); const f = el('div', 'float ' + (cls || ''), esc(text)); f.style.left = r.left - a.left + r.width / 2 + (Math.random() * 30 - 15) + 'px'; f.style.top = r.top - a.top + 50 + 'px'; $('#arena').appendChild(f); setTimeout(() => f.remove(), 1200); }
  function anim(uid, c, ms) { const d = node(uid); if (!d) return Promise.resolve(); d.classList.remove(c); void d.offsetWidth; d.classList.add(c); return sleep(ms).then(() => d.classList.remove(c)); }
  function logEvents(evs) {
    const box = $('#log'), nm = (id) => (id && U(id) ? U(id).name : '?');
    evs.forEach((e) => {
      let t = null, c = '';
      switch (e.t) {
        case 'round': t = '=== Rodada ' + e.n + ' ===  ' + e.order.map(nm).join(' › '); c = 'sy'; break;
        case 'turn': t = 'Vez de ' + nm(e.uid); c = 'sy'; break;
        case 'skill': t = nm(e.src) + ' usa ' + e.nome; break;
        case 'dmg': t = nm(e.tgt) + ' sofre ' + e.amount + (e.crit ? ' (CRÍTICO)' : ''); c = 'dm'; break;
        case 'miss': t = nm(e.src) + ' erra ' + nm(e.tgt) + ' (' + e.chance + '%)'; break;
        case 'fx': t = nm(e.uid) + ' ← ' + e.nome + (e.stacks > 1 ? ' ×' + e.stacks : ''); c = 'ef'; break;
        case 'pass': t = nm(e.uid) + ' passa o turno'; break;
        case 'defeat': t = nm(e.uid) + ' foi derrotado!'; c = 'df'; break;
        case 'win': t = e.winner < 0 ? 'Empate!' : 'Equipe ' + 'AB'[e.winner] + ' venceu!'; c = 'df'; break;
      }
      if (t) box.appendChild(el('div', c, esc(t)));
    });
    box.scrollTop = box.scrollHeight;
  }
  async function run(fn) {
    busy = true; $$('.unit.pick').forEach((x) => x.classList.remove('pick'));
    let evs; try { evs = fn(); } catch (err) { logEvents([]); $('#log').appendChild(el('div', 'dm', 'Recusado: ' + esc(err.message))); busy = false; renderSkills(); return; }
    for (const e of evs) {
      logEvents([e]);
      if (e.t === 'skill') { await anim(e.src, 'lunge' + U(e.src).team, 450); }
      else if (e.t === 'dmg') { shown[e.tgt].hp = e.hpAfter; floater(e.tgt, '-' + e.amount, e.crit ? 'crit' : ''); anim(e.tgt, 'shake', 350); refresh(); await sleep(260); }
      else if (e.t === 'miss') { floater(e.tgt, 'ERROU', 'miss'); await sleep(250); }
      else if (e.t === 'fx') { floater(e.uid, e.nome, 'txt'); refresh(); await sleep(120); }
      else if (e.t === 'stamina') { shown[e.uid].st = e.value; refresh(); }
      else if (e.t === 'turn') { shown[e.uid].st = e.stamina; }
      else if (e.t === 'win') { await sleep(300); const w = $('#winner'); w.hidden = false; w.innerHTML = e.winner < 0 ? 'EMPATE' : 'VITÓRIA<br>EQUIPE ' + 'AB'[e.winner]; }
    }
    B.units.forEach((u) => { shown[u.uid].hp = u.hp; shown[u.uid].st = u.stamina; });
    busy = false; refresh();
  }

  /* ---------- dados (leitura das tabelas) ---------- */
  let tab = 'herois';
  const stNames = (l) => (l || []).map((x) => x.nome + (x.x > 1 ? ' x' + x.x : '')).join(', ');
  const TABLES = {
    herois: { nome: 'Heróis', hint: 'Vem de dados/maa.xlsx (aba Characters).', rows: () => [['ID', 'Nome', 'Classe', 'Health', 'Stamina', 'Attack', 'Defense', 'Accuracy', 'Evasion', 'Organization', 'Effects', 'Golpes', 'Bio']].concat(D.herois.map((h) => [h.id, h.nome, h.classe, h.hp, h.stamina, h.atk, h.def, h.acc, h.eva, h.afiliacoes.join(', ') || 'pendente', h.passivas.join(', ') || '—', h.golpes.length, h.bio || 'pendente'])) },
    golpes: { nome: 'Golpes', hint: 'Vem de dados/maa.xlsx (aba Skills). Dano por hit = Total damage ÷ Hits × Ataque ÷ Defesa.', rows: () => [['ID', 'Herói', 'Golpe', 'Ícone', 'Stamina %', 'Alvo', 'Total damage', 'Cooldown', 'Hits', 'Hit %', 'Crit %', 'Tipos', 'Propriedades', 'One Enemy / One Ally', 'Self', 'All (enemies/allies)']].concat(D.golpes.map((s) => [s.id, s.heroi, s.nome, s.icone, s.custo, s.alvo, s.dano, s.recarga, s.golpes, s.hit == null ? '' : s.hit, s.crit, s.tipos.join(' '), s.props.join(', ') || '—', stNames((s.aplica.enemy1 || []).concat(s.aplica.ally1 || [])) || '—', stNames(s.aplica.self) || '—', stNames((s.aplica.enemyAll || []).concat(s.aplica.allyAll || [])) || '—'])) },
    status: { nome: 'Status usados', hint: 'Nomes de debuffs/buffs citados nos golpes. Por enquanto só aparecem como etiqueta, sem efeito (a biblioteca vem depois).', rows: () => { const m = {}; D.golpes.forEach((s) => Object.values(s.aplica).forEach((l) => l.forEach((x) => { (m[x.nome] = m[x.nome] || new Set()).add(s.nome); }))); return [['Status', 'Golpes que aplicam']].concat(Object.entries(m).sort().map(([k, v]) => [k, [...v].join(', ')])); } },
    props: { nome: 'Propriedades usadas', hint: 'Special Properties citadas nos golpes. Sem efeito por enquanto.', rows: () => { const m = {}; D.golpes.forEach((s) => s.props.forEach((p) => { (m[p] = m[p] || new Set()).add(s.nome); })); return [['Propriedade', 'Golpes']].concat(Object.entries(m).sort().map(([k, v]) => [k, [...v].join(', ')])); } },
    config: { nome: 'Config / Classes', hint: 'Classes ainda sem vantagens/desvantagens (futuro).', rows: () => [['Chave', 'Valor']].concat(Object.entries(D.config).map(([k, v]) => [k, JSON.stringify(v)]), Object.entries(D.classes).map(([k, v]) => ['classe ' + k, JSON.stringify(v)])) }
  };
  function renderData() {
    const t = $('#datTabs'); t.innerHTML = '';
    Object.keys(TABLES).forEach((k) => { const b = el('button', k === tab ? 'on' : '', TABLES[k].nome); b.onclick = () => { tab = k; renderData(); }; t.appendChild(b); });
    $('#datHint').textContent = TABLES[tab].hint;
    const rows = TABLES[tab].rows(), tb = $('#datTable'); tb.innerHTML = '';
    rows.forEach((r, i) => { const tr = el('tr'); r.forEach((c, j) => { const td = el(i ? 'td' : 'th', '', esc(c)); if (i && /Provisório/.test(rows[0][j]) && c) td.className = 'pv'; tr.appendChild(td); }); tb.appendChild(tr); });
  }
  $('#datCsv').onclick = () => {
    const rows = TABLES[tab].rows(), q = (v) => { v = String(v == null ? '' : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const a = el('a'); a.href = URL.createObjectURL(new Blob(['﻿' + rows.map((r) => r.map(q).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' })); a.download = tab + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  };

  renderSel();
})();
</script>
</body>
</html>
